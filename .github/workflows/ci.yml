name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: Full experiment (train, monitor, retrain)
        run: python -m fraudstream.pipeline --out artifacts --docs ci_docs
      - name: Stream replay (latency + throughput)
        run: python -m fraudstream.replay --limit 20000
      - uses: actions/upload-artifact@v4
        with: {name: experiment-report, path: ci_docs/}
  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fraudstream .
